name: Release (Windows)

# Dispara ao enviar uma tag vX.Y.Z (ou manualmente).
# Com a SignPath configurada (variável SIGNPATH_ORGANIZATION_ID + segredo SIGNPATH_API_TOKEN),
# assina o Dueto.exe antes de montar o instalador e depois assina o instalador e a versão portátil.
# Sem a SignPath configurada, gera os binários sem assinatura. Passo a passo em docs/assinatura-de-codigo.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ASSINAR: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest -q
        working-directory: tools/fator_r

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # 1) app desempacotado (win-unpacked)
      - name: Empacotar app (win-unpacked)
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Enviar win-unpacked para assinatura
        if: env.ASSINAR == 'true'
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: release/publico/win-unpacked/

      - name: Assinar Dueto.exe (SignPath)
        if: env.ASSINAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dueto' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/win-unpacked

      # 2) instalador e portátil a partir do app (assinado, quando houver)
      - name: Montar instalador e portátil
        shell: pwsh
        run: |
          $dir = if ($env:ASSINAR -eq 'true') { 'signed/win-unpacked' } else { 'release/publico/win-unpacked' }
          npx electron-builder --win --x64 --publish never --prepackaged $dir

      - name: Enviar instaladores para assinatura
        if: env.ASSINAR == 'true'
        id: upload-installers
        uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: |
            release/publico/Dueto-Setup-*.exe
            release/publico/Dueto-portable.exe

      - name: Assinar instaladores (SignPath)
        if: env.ASSINAR == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'dueto' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/instaladores

      - name: Separar binários finais
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $src = if ($env:ASSINAR -eq 'true') { 'signed/instaladores' } else { 'release/publico' }
          Copy-Item "$src/Dueto-Setup-*.exe", "$src/Dueto-portable.exe" dist-release/
          Get-ChildItem dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: dueto-windows
          path: dist-release/

      - name: Notas da versão (CHANGELOG)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/notas-da-versao.mjs "${{ github.ref_name }}" > notas.md

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dueto ${{ github.ref_name }}
          body_path: notas.md
          files: dist-release/*
          overwrite_files: true
